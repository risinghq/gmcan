<mat-tab-group [color]="black" class="noticias-div" [(selectedIndex)]="selectedTab" (selectedIndexChange)="changedTab($event)"> 
  <mat-tab label="Listado de noticias"> 
    <div class="flex-news mb-16">
      <div class="search-news">
        <input class="input-search-text" (keyup)="applyFilter($event)" placeholder="Buscar noticias por título, fecha de publicación, categoría, autor o estado.">
        <mat-icon class="icon-search-toolbar">search</mat-icon>
      </div>
      <div class="center btn-black"  (click)="addNews()">
        <a class="link">
          Agregar noticia
        </a>
      </div>
    </div>
    <table mat-table [dataSource]="dataSource" *ngIf="!displayedNotFound" matSort>

      <!-- ID Column -->
      <ng-container matColumnDef="titulo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Titulo </th>
        <td mat-cell class="titulo-list" *matCellDef="let row" (click)="editNews(row.idNoticia)" > {{row.titulo}} </td>
      </ng-container>

      <!-- Progress Column -->
      <ng-container matColumnDef="fechaPublicacion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Publicacion </th>
        <td mat-cell *matCellDef="let row" (click)="editNews(row.idNoticia)"> {{row.fechaPublicacion}}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="nombreTipoNoticia">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Categoría </th>
        <td mat-cell *matCellDef="let row" (click)="editNews(row.idNoticia)"> {{row.nombreTipoNoticia}} </td>
      </ng-container>

      <!-- Color Column -->
      <ng-container matColumnDef="autor">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Autor </th>
        <td mat-cell *matCellDef="let row" [style.color]="row.autor" (click)="editNews(row.idNoticia)"> 
          <div class="flex-news">
            <div class="member-img-round mr-8">
              <img class="member-img" src="{{url+'usuario/get-image-usuario/'+row.foto}}" alt="../../assets/img/user.png" *ngIf="row.foto">
              <img class="member-img" src="../../assets/img/user.png" alt="" *ngIf="!row.foto">
            </div>
            {{row.autor}} 
          </div>          
        </td>
      </ng-container>

      <!-- Estado Column -->
      <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Estado </th>
          <td mat-cell *matCellDef="let row" [ngClass]="{ 'on-status' : row.estado== 1,
          'off-status' : row.estado==0 }" (click)="editNews(row.idNoticia)"> {{row.status}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [hidden]="displayedNotFound"></mat-paginator>
    <span class="plex-sans" *ngIf="displayedNotFound">No se encontraron resultados</span>
  </mat-tab>
  <mat-tab label="Categorías">
    <div class="flex-news mb-16">
      <div class="search-news">
        <input class="input-search-text" (keyup)="applyFilter2($event)" placeholder="Buscar categoría por nombre">
        <mat-icon class="icon-search-toolbar">search</mat-icon>
      </div>
      <div class="center btn-black" (click)="addCategory()">
        <a class="link">
          Agregar categoría
        </a>
      </div>
    </div>
    <table mat-table [dataSource]="dataSource2" *ngIf="!displayedNotFound2" matSort>

      <!-- ID Column -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre de categoría </th>
        <td mat-cell class="titulo-list" *matCellDef="let row" (click)="editCategory(row.idtipoNoticia)"> {{row.nombre}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns2"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns2;">
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [hidden]="displayedNotFound2"></mat-paginator>
    <span class="plex-sans" *ngIf="displayedNotFound2">No se encontraron resultados</span>
  </mat-tab>
</mat-tab-group>
