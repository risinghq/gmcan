<div class="pad">
    <div class="add-box">
        <div class="member-detail-links">
            <div class="flex-news">
            <div class="flex-news back-div" (click)="return()">
                <mat-icon class="back-icon">
                    arrow_back
                </mat-icon>
                <div class="back-text">
                    Volver
                </div>
            </div>
            <div class="right obligatory-text">
                <span class="red-text">(*) </span>Campos obligatorios
            </div>
        </div>
            <form [formGroup]="equipoForm"  class="mt-24 mb-32">
                <div class="flex-news">
                    <div class="mr-32 full-width">
                        <div class="text-category">
                            Nombre del equipo <span class="red-text">*</span>
                        </div>
                        <input [(ngModel)]="equipo.nombre" formControlName="nombre" name="nombre" class="input-category" required>
                    </div>
                    <div class="full-width">
                        <div class="text-category">
                            CPU
                        </div>
                        <input [(ngModel)]="equipo.cpu" formControlName="cpu" name="cpu" class="input-category" required>
                    </div>
                </div>
                <div class="flex-news">
                    <div class="mr-32 full-width">
                        <div class="text-category">
                            RAM
                        </div>
                        <input [(ngModel)]="equipo.gpu" formControlName="gpu" name="gpu" class="input-category" required>
                    </div>
                    <div class="full-width">
                        <div class="text-category">
                            GPU
                        </div>
                        <input [(ngModel)]="equipo.ram" formControlName="ram" name="ram" class="input-category" required>
                    </div>
                </div>
                <div class="mr-32 mid-width">
                    <div class="text-category">
                        HD
                    </div>
                    <input [(ngModel)]="equipo.hd" formControlName="hd" name="hd" class="input-category" required>
                </div>
            </form>
            <div class="flex-news">
                <div class='red-btn' *ngIf="edit">
                    <div class="link link-set link-red" (click)="openEraser()">
                      Eliminar equipo
                    </div>
                </div>
                <div class="right" [ngClass]="{'btn-grey':!equipoForm.valid,'black-btn':equipoForm.valid}">
                    <div class="link link-set" (click)="submitEquipo()">
                      {{button_text}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
