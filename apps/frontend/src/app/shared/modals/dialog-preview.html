<div class="card-detail scroll">
  <div class="news-title-div">
    @if (noticia.photo) {
    <img class="detail-img" src="{{noticia.photo}}" />
    }
    <div class="news-title">{{noticia.title}}</div>
  </div>
  <div class="detail-text-div">
    <div class="news-abstract">{{noticia.summary}}</div>
    <div class="flex-news other-div"></div>
    <div class="autor-div">
      <div class="autor-img-div">
        @if (noticia.author?.photo) {
        <img class="autor-img" src="{{noticia.author?.photo}}" />
        }
      </div>
      <div class="autor-text">
        <div class="news-type">{{noticia.newsTypeName}}</div>
        <div class="autor-name">
          {{noticia.author?.firstName}} {{noticia.author?.lastName}} {{noticia.author?.maternalName}}
        </div>
        <div class="news-date">{{dia}} {{mes}} {{anio}}</div>
      </div>
    </div>
    <div id="newsBody" class="detail-text" style="white-space: pre-wrap"></div>
  </div>
</div>
<div class="outside" [mat-dialog-close]="false">X</div>
