<div class="bb">
  <img class="logo-nav logo-modal" src="{{url + 'api/assets/group-header.png'}}" alt="logo" />
  <div class="email-text right" [style.display]="(screenWidth > 960) ? 'block' : 'none'">
    {{language.joinUsModal[0].succesful}}
  </div>
</div>
<div class="success-div">
  <div class="email-center">
    <div class="success-text">
      {{language.joinUsModal[0].succesfulText}}
      <br />
      {{language.joinUsModal[0].succesfulText1}}
    </div>
    <div class="success-text-green">{{language.joinUsModal[0].thanks}}</div>
  </div>
  <button mat-button class="success-right btn-under2" (click)="onNoClick()">{{language.joinUsModal[0].back}}</button>
</div>
