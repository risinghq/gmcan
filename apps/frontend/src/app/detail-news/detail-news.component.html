<div class="detail-div">
    <div *ngIf="!cargado">
        <mat-spinner [color]="green"></mat-spinner>
    </div>
    <div class="row" *ngIf="cargado">
        <div class="col-lg-8 col-sm-6 col-12">
                <div class="detail-links">
                    <a class="detail-link-active" href="/">Inicio</a>
                    <mat-icon class="detail-icon">
                        arrow_right
                    </mat-icon>
                    <a class="detail-link-active" href="/{{previouslink}}">{{previouspage}}</a>
                    <mat-icon class="detail-icon">
                        arrow_right
                    </mat-icon>
                    <a class="detail-link">Detalle de Noticia</a>
                </div>
                <div class="card-detail">
                    <div class="news-title-div">
                        <img class="detail-img" src="../../assets/img/grupal.jpg">
                        <div class="news-title">
                            {{noticia.titulo}}
                        </div>
                    </div>
                    <div class="detail-text-div">
                        <div class="flex-news other-div">
                            <div class="news-type d-sm-block d-xs-block d-md-none d-lg-none d-xl-none">
                                {{noticia.nombreTipoNoticia}}
                            </div>
                            <div class="share-div d-sm-block d-xs-block d-md-none d-lg-none d-xl-none">
                                <div class="flex-news">
                                    <img class="share-icon" (mouseenter) ="mouseEnter(1)"  (mouseleave) ="mouseLeave(1)" src="{{fbicon}}">
                                    <img class="share-icon" (mouseenter) ="mouseEnter(2)"  (mouseleave) ="mouseLeave(2)" src="{{twitter}}">
                                </div>
                            </div>
                        </div>
                        <div class="autor-div">
                            <div class="autor-img-div">
                                <img class="autor-img" src="../../assets/img/images.png">
                            </div>
                            <div class="autor-text">
                                <div class="news-type d-none d-md-block d-lg-block d-xl-block">
                                    {{noticia.nombreTipoNoticia}}
                                </div>
                                <div class="autor-name">
                                    {{usuario.nombre}}
                                </div>
                                <div class="news-date">
                                    Escrito el {{dia}} de {{mes}} del {{anio}}
                                </div>
                            </div>
                            <div class="share-div d-none d-md-block d-lg-block d-xl-block">
                                <div class="flex-news share-flex">
                                    <img class="share-icon" (mouseenter) ="mouseEnter(1)"  (mouseleave) ="mouseLeave(1)" src="{{fbicon}}">
                                    <img class="share-icon" (mouseenter) ="mouseEnter(2)"  (mouseleave) ="mouseLeave(2)" src="{{twitter}}">
                                </div>
                            </div>
                        </div>
                        <div class="detail-text" style="white-space:pre-wrap;">
                            {{noticia.cuerpo}}
                        </div>
                    </div>
                </div>
        </div>
        <div class="col-lg-4 col-sm-6 col-12">
            <app-news></app-news>
        </div>
    </div>
</div>
