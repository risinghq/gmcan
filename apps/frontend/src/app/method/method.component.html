<div class="card-methods">
    <div class="methods-text-div">
        <div *ngFor="let method of methods; let i=index">
            <div class="methods-img-div">
                <img class="methods-img" src="{{url+'metodo/get-image-metodo/'+method.foto}}" *ngIf="method.foto">
            </div>
            <div class="methods-title">
                {{method.nombre}}
            </div>
            <div class="methods-sub-divi"></div>
            <div id="descripcion{{i}}" class="methods-text">
            </div>
        </div>
    </div>
</div>
