<div class="noticias-div">
    <div class="flex-news mb-16">
        <div class="search-news">
          <input class="input-search-text" (keyup)="applyFilter($event)" placeholder="Buscar tesis por nombre">
          <mat-icon class="icon-search-toolbar">search</mat-icon>
        </div>
        <div class="center btn-black" *ngIf="publicacionPermiso" (click)="addThesis()">
          <a class="link">
            Agregar tesis
          </a>
        </div>
      </div>
      <table mat-table [dataSource]="dataSource" [hidden]="displayedNotFound" matSort>
  
        <!-- ID Column -->
        <ng-container matColumnDef="titulo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Título </th>
          <td mat-cell *matCellDef="let row" (click)="editThesis(row.idPublicacion)"> {{row.titulo}} </td>
        </ng-container>

        <ng-container matColumnDef="tipo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Tipo </th>
          <td mat-cell *matCellDef="let row" (click)="editThesis(row.idPublicacion)"> {{row.tipoTesis}} </td>
        </ng-container>

        <ng-container matColumnDef="autores">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Autor(es) </th>
          <td mat-cell *matCellDef="let row" (click)="editThesis(row.idPublicacion)">
            <div class="flex-news" *ngFor="let usuario of row.usuario">
              <div class="member-img-round mr-8">
                <img class="member-img" src="{{url+'usuario/get-image-usuario/'+row.usuario[0].foto}}" alt="../../assets/img/user.png" *ngIf="usuario.foto">
                <img class="member-img" src="../../assets/img/user.png" alt="" *ngIf="!usuario.foto">
              </div>
              {{usuario.nombreCompleto}}
            </div>
            <div class="flex-news" *ngFor="let autor of row.autor">
              {{autor.nombre}}
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="universidad">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Universidad </th>
          <td mat-cell *matCellDef="let row" (click)="editThesis(row.idPublicacion)"> {{row.universidad}} </td>
        </ng-container>

        <ng-container matColumnDef="publicacion">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Publicación </th>
          <td mat-cell *matCellDef="let row" (click)="editThesis(row.idPublicacion)"> {{row.fecha}} </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;">
        </tr>
      </table>
  
      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [hidden]="displayedNotFound"></mat-paginator>
      <span class="plex-sans" *ngIf="displayedNotFound">No se encontraron resultados</span>
</div>
