<div class="pad">
  <div class="add-box">
    <div class="member-detail-links">
      <div class="flex-news">
        <div class="flex-news back-div" (click)="return()">
          <mat-icon class="back-icon"> arrow_back </mat-icon>
          <div class="back-text">Volver</div>
        </div>
        <div class="right obligatory-text"><span class="red-text">(*) </span>Campos obligatorios</div>
      </div>
      <form [formGroup]="categoryForm" class="flex-news mt-24 mb-32">
        <div class="mr-32 full-width">
          <div class="text-category">Categoría en español <span class="red-text">*</span></div>
          <input
            [(ngModel)]="category.nombre"
            formControlName="nombre"
            name="nombre"
            class="input-category"
            placeholder="Agregar categoría en español"
            required
          />
        </div>
        <div class="full-width">
          <div class="text-category">Categoría en ingles <span class="red-text">*</span></div>
          <input
            [(ngModel)]="category.nombreEN"
            formControlName="nombreEN"
            name="nombreEN"
            class="input-category"
            placeholder="Agregar categoría en inglés"
            required
          />
        </div>
      </form>
      <div class="flex-news">
        <div [ngClass]="{ 'btn-grey': !notCanDo, 'red-btn': notCanDo }" *ngIf="edit">
          <div class="link link-set link-red" (click)="openEraser()">Eliminar categoría</div>
        </div>
        <div class="right" [ngClass]="{ 'btn-grey': !categoryForm.valid, 'black-btn': categoryForm.valid }">
          <div class="link link-set" (click)="submitCategory()">
            {{ button_text }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
