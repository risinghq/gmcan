<div class="pad">
  <div class="add-box">
    <div class="member-detail-links">
      <div class="flex-news">
        <div class="flex-news back-div" (click)="return()">
          <mat-icon class="back-icon"> arrow_back </mat-icon>
          <div class="back-text">Volver</div>
        </div>
        <div class="right obligatory-text"><span class="red-text">(*) </span>Campos obligatorios</div>
      </div>
      <form [formGroup]="eventoForm" class="mt-24 mb-32">
        <div class="full-width">
          <div class="text-category">Nombre oficial del evento <span class="red-text">*</span></div>
          <input
            [(ngModel)]="evento.name"
            formControlName="name"
            name="name"
            class="input-category"
            placeholder="Ingresar nombre"
            required
          />
        </div>
        <div class="flex-news mt-8">
          <div class="mr-32 full-width">
            <div class="text-category">País <span class="red-text">*</span></div>
            <input
              [(ngModel)]="evento.country"
              formControlName="country"
              name="country"
              class="input-category"
              placeholder="Ingresar país"
              required
            />
          </div>
          <div class="full-width">
            <div class="text-category">Ciudad <span class="red-text">*</span></div>
            <input
              [(ngModel)]="evento.city"
              formControlName="city"
              name="city"
              class="input-category"
              placeholder="Ingresar ciudad"
              required
            />
          </div>
        </div>
      </form>
      <div class="flex-news">
        @if (edit) {
          <div [class]="{ 'btn-grey': !notCanDo, 'red-btn': notCanDo }">
            <div class="link link-set link-red" (click)="openEraser()">Eliminar evento</div>
          </div>
        }
        <div class="right" [class]="{ 'btn-grey': !eventoForm.valid, 'black-btn': eventoForm.valid }">
          <div class="link link-set" (click)="submitEvento()">
            {{ button_text }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
