<mat-tab-group class="noticias-div" [(selectedIndex)]="selectedTab" (selectedIndexChange)="changedTab($event)">
  <mat-tab label="Listado de resumenes">
    <div class="flex-news mb-16">
      <div class="search-news">
        <input
          class="input-search-text"
          (keyup)="applyFilter($event)"
          placeholder="Buscar resúmen por título, fecha de publicación o evento"
        />
        <mat-icon class="icon-search-toolbar">search</mat-icon>
      </div>
      <div class="center btn-black" (click)="addResumen()">
        <a class="link"> Agregar resumen </a>
      </div>
    </div>
    <table mat-table [dataSource]="dataSource" [hidden]="displayedNotFound" matSort>
      <!-- ID Column -->
      <ng-container matColumnDef="titulo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Título</th>
        <td mat-cell *matCellDef="let row" (click)="editResumen(row.idPublicacion)">
          {{ row.titulo }}
        </td>
      </ng-container>

      <ng-container matColumnDef="primerAutor">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Primer autor</th>
        <td mat-cell *matCellDef="let row" (click)="editResumen(row.idPublicacion)">
          <div class="flex-news" *ngIf="row.autor && row.autor.length != 0">
            <div class="member-img-round mr-8" *ngIf="row.autor[0].kind === 'registered'">
              <img
                class="member-img"
                src="{{ url + 'usuario/get-image-usuario/' + row.autor[0].foto }}"
                alt="../../assets/img/user.png"
                *ngIf="row.autor[0].foto"
              />
              <img class="member-img" src="../../assets/img/user.png" alt="" *ngIf="!row.autor[0].foto" />
            </div>
            {{ row.autor[0].nombre }}
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="presentacion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Publicación</th>
        <td mat-cell *matCellDef="let row" (click)="editResumen(row.idPublicacion)">
          {{ row.fecha }}
        </td>
      </ng-container>

      <ng-container matColumnDef="evento">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Evento</th>
        <td mat-cell *matCellDef="let row" (click)="editResumen(row.idPublicacion)">
          {{ row.evento }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [hidden]="displayedNotFound"></mat-paginator>
    <span class="plex-sans" *ngIf="displayedNotFound">No se encontraron resultados</span>
  </mat-tab>
  <mat-tab label="Eventos">
    <div class="flex-news mb-16">
      <div class="search-news">
        <input
          class="input-search-text"
          (keyup)="applyFilter2($event)"
          placeholder="Buscar evento por nombre, país o ciudad"
        />
        <mat-icon class="icon-search-toolbar">search</mat-icon>
      </div>
      <div class="center btn-black" (click)="addEvento()">
        <a class="link"> Agregar evento </a>
      </div>
    </div>
    <table mat-table [dataSource]="dataSource2" [hidden]="displayedNotFound2" matSort>
      <!-- ID Column -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let row" (click)="editEvento(row.idEvento)">{{ row.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="pais">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>País</th>
        <td mat-cell *matCellDef="let row" (click)="editEvento(row.idEvento)">{{ row.pais }}</td>
      </ng-container>

      <ng-container matColumnDef="ciudad">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Ciudad</th>
        <td mat-cell *matCellDef="let row" (click)="editEvento(row.idEvento)">{{ row.ciudad }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns2"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns2"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [hidden]="displayedNotFound2"></mat-paginator>
    <span class="plex-sans" *ngIf="displayedNotFound2">No se encontraron resultados</span>
  </mat-tab>
</mat-tab-group>
