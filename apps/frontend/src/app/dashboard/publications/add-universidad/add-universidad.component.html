<div class="pad">
  <div class="add-box">
    <div class="member-detail-links">
      <div class="flex-news">
        <div class="flex-news back-div" (click)="return()">
          <mat-icon class="back-icon"> arrow_back </mat-icon>
          <div class="back-text">Volver</div>
        </div>
        <div class="right obligatory-text"><span class="red-text">(*) </span>Campos obligatorios</div>
      </div>
      <form [formGroup]="universidadForm" class="flex-news mt-24 mb-32">
        <div class="mr-32 full-width">
          <div class="text-category">Nombre de universidad en español <span class="red-text">*</span></div>
          <input
            [(ngModel)]="universidad.nombre"
            formControlName="nombre"
            name="nombre"
            class="input-category"
            placeholder="Insertar nombre en español"
            required
          />
        </div>
        <div class="full-width">
          <div class="text-category">Nombre de universidad en inglés <span class="red-text">*</span></div>
          <input
            [(ngModel)]="universidad.nombreEN"
            formControlName="nombreEN"
            name="nombreEN"
            class="input-category"
            placeholder="Insertar nombre en inglés"
            required
          />
        </div>
      </form>
      <div class="flex-news">
        @if (edit) {
          <div [class]="{ 'btn-grey': !notCanDo, 'red-btn': notCanDo }">
            <div class="link link-set link-red" (click)="openEraser()">Eliminar universidad</div>
          </div>
        }
        <div class="right" [class]="{ 'btn-grey': !universidadForm.valid, 'black-btn': universidadForm.valid }">
          <div class="link link-set" (click)="submitUniversidad()">
            {{ button_text }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
