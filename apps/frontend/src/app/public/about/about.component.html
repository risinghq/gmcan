<div class="about-div">
  <div class="row">
    <div class="col-lg-8 col-sm-6 col-12">
      <div class="about-links">
        <a class="about-link-active" href="/">{{ facade.language().home }}</a>
        <mat-icon class="about-icon"> arrow_right </mat-icon>
        <a class="about-link-active">{{ facade.language().aboutUs }}</a>
        <mat-icon class="about-icon"> arrow_right </mat-icon>
        <a class="about-link short-text">{{ facade.selectedCategory() }}</a>
      </div>
      <router-outlet />
    </div>
    <div class="col-lg-4 col-sm-6 col-12">
      <div class="about-categories">
        <div
          class="about-category"
          routerLink="./about"
          (click)="selected(facade.language().who)"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ facade.language().who }}
        </div>
        <div
          class="about-category"
          routerLink="./lines-investigation"
          (click)="selected(facade.language().linesInvestigation)"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ facade.language().linesInvestigation }}
        </div>
        <div
          class="about-category"
          routerLink="./methods"
          (click)="selected(facade.language().methods)"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ facade.language().methods }}
        </div>
        <div
          class="about-category"
          routerLink="./facilities-resources"
          (click)="selected(facade.language().resources)"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ facade.language().resources }}
        </div>
        <div
          class="about-category"
          routerLink="./works"
          (click)="selected(facade.language().futureWorks)"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ facade.language().futureWorks }}
        </div>
      </div>
    </div>
  </div>
</div>
