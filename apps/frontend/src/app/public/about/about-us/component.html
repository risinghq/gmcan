<div class="card-about">
  @if (!aboutus.foto) {
  <img class="about-img" src="../../assets/img/grupal.jpg" />
  } @if (aboutus.foto) {
  <img class="about-img" src="{{ url + 'sobrenosotros/' + aboutus.idSobreNosotros + '/file }}" />
  }
  <div class="about-text-div">
    <div class="about-title">{{ language.aboutText[0].aboutUs }}</div>
    <div class="about-sub-divi"></div>
    <div class="about-text" [innerHTML]="aboutus.quienesSomos ?? ''"></div>
    <div class="about-title about-top">{{ language.aboutText[0].ourObjectives }}</div>
    <div class="about-subtitle">{{ language.aboutText[0].ourObjectivesQuestion }}</div>
    <div class="about-sub-divi"></div>
    <div class="about-text" [innerHTML]="aboutus.objetivos ?? ''"></div>
    <div class="about-title about-top">{{ language.aboutText[0].ourServices }}</div>
    <div class="about-subtitle">{{ language.aboutText[0].ourServicesQuestion }}</div>
    <div class="about-sub-divi"></div>
    <div class="about-text" [innerHTML]="aboutus.servicios ?? ''"></div>
  </div>
</div>
