<div class="pad">
    <div class="add-box">
        <div class="member-detail-links">
            <div class="flex-news">
                <div class="flex-news back-div" (click)="return()">
                    <mat-icon class="back-icon">
                        arrow_back
                    </mat-icon>
                    <div class="back-text">
                        Volver
                    </div>
                </div>
                <div class="right obligatory-text">
                    <span class="red-text">(*) </span>Campos obligatorios
                </div>
            </div>
            <form [formGroup]="eventoForm"  class="mt-24 mb-32">
                <div class="full-width">
                    <div class="text-category">
                        Nombre oficial del evento <span class="red-text">*</span>
                    </div>
                    <input [(ngModel)]="evento.nombre" formControlName="nombre" name="nombre" class="input-category" placeholder="Ingresar nombre" required>
                </div>
                <div class="flex-news mt-8">
                    <div class="mr-32 full-width">
                        <div class="text-category">
                            País en español <span class="red-text">*</span>
                        </div>
                        <input [(ngModel)]="evento.pais" formControlName="pais" name="pais" class="input-category" placeholder="Escriba el país" required>
                    </div>
                    <div class="full-width ">
                        <div class="text-category">
                            País en inglés <span class="red-text">*</span>
                        </div>
                        <input [(ngModel)]="evento.paisEN" formControlName="paisEN" name="paisEN" class="input-category" placeholder="Escriba el país" required>
                    </div>
                </div>
                <div class="flex-news mt-8">
                    <div class="mr-32 full-width">
                        <div class="text-category">
                            Ciudad en español <span class="red-text">*</span>
                        </div>
                        <input [(ngModel)]="evento.ciudad" formControlName="ciudad" name="ciudad" class="input-category" placeholder="Escriba la ciudad" required>
                    </div>
                    <div class="full-width">
                        <div class="text-category">
                            Ciudad en inglés <span class="red-text">*</span>
                        </div>
                        <input [(ngModel)]="evento.ciudadEN" formControlName="ciudadEN" name="ciudadEN" class="input-category" placeholder="Escriba la ciudad" required>
                    </div>
                </div>
            </form>
            <div class="flex-news">
                <div [ngClass]="{'btn-grey':!notCanDo,'red-btn':notCanDo}" *ngIf="edit">
                    <div class="link link-set link-red" (click)="openEraser()">
                      Eliminar evento
                    </div>
                </div>
                <div class="right" [ngClass]="{'btn-grey':!eventoForm.valid,'black-btn':eventoForm.valid}">
                    <div class="link link-set" (click)="submitEvento()">
                      {{button_text}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
