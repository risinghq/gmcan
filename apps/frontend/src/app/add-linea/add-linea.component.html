<div class="pad">
    <div class="add-box">
        <div class="flex-news">
            <div class="flex-news back-div" (click)="return()">
                <mat-icon class="back-icon">
                    arrow_back
                </mat-icon>
                <div class="back-text">
                    Volver
                </div>
            </div>
            <div class="right obligatory-text">
                <span class="red-text">(*) </span>Campos obligatorios
            </div>
        </div>
        <form [formGroup]="lineaForm" class="mt-24">
            <div class="flex-news full-width">
                <div class="full-width mr-32">
                    <div class="full-width">
                        <div class="text-category">
                            Nombre de línea en español <span class="red-text">*</span>
                        </div>
                        <input class="input-category" [(ngModel)]="lineaInvestigacion.nombre" formControlName="nombre" name="nombre" required>
                    </div>
                    <div class="full-width">
                        <div class="text-category">
                            Nombre de línea en inglés <span class="red-text">*</span>
                        </div>
                        <input class="input-category" [(ngModel)]="lineaInvestigacion.nombreEN" formControlName="nombreEN" name="nombreEN" required>
                    </div>
                </div>
                <div class="">
                    <div class="text-category">
                        Imagen <span class="red-text">*</span>
                    </div>
                    <div class="img-preview" *ngIf="previewUrl">
                        <img class="img-set" src="{{previewUrl}}">
                    </div>
                    <div class="news-img" *ngIf="!previewUrl && !lineaInvestigacion.foto">
                        <img class="icon-upload" src="../../assets/img/upload.svg">
                    </div>
                    <div class="img-preview" *ngIf="lineaInvestigacion.foto && !previewUrl">
                        <img class="img-set" src="{{url+'lineasinvestigacion/get-image-lineainvestigacion/'+lineaInvestigacion.foto}}">
                    </div>
                    <div class="green-text mt-16">
                        <span class="plex-sans" *ngIf="!previewUrl">Insertar imagen</span>
                        <span class="plex-sans" *ngIf="previewUrl">Cambiar imagen</span>
                        <input class="file_upload" type="file" #file
                        accept="image/*" required
                        (change)="fileProgress($event)"/>
                    </div>
                </div>
            </div>
            <div class="full-width mb-32">
                <div class="text-category">
                    Descripcion en español <span class="red-text">*</span>
                </div>
                <textarea [(ngModel)]="lineaInvestigacion.descripcion" formControlName="descripcion" name="descripcion" autosize class="input-category" required></textarea>
            </div>
            <div class="full-width mb-32">
                <div class="text-category">
                    Descripcion en inglés <span class="red-text">*</span>
                </div>
                <textarea [(ngModel)]="lineaInvestigacion.descripcionEN" formControlName="descripcionEN" name="descripcionEN" autosize class="input-category" required></textarea>
            </div>
            <div class="flex-news">
                <div [ngClass]="{'btn-grey':!notCanDo,'red-btn':notCanDo}" *ngIf="edit">
                    <div class="link link-set link-red" (click)="openEraser()">
                      Eliminar línea
                    </div>
                </div>
                <div class="right" [ngClass]="{'btn-grey':!lineaForm.valid ,'black-btn':lineaForm.valid} ">
                    <div class="link link-set" (click)="submitLinea()">
                      {{button_text}}
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
