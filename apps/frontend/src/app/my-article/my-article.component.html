<div class="noticias-div">
  <div class="flex-news mb-16">
    <div class="search-news">
      <input
        class="input-search-text"
        (keyup)="applyFilter($event)"
        placeholder="Buscar artículos por título o fecha de publicación"
      />
      <mat-icon class="icon-search-toolbar">search</mat-icon>
    </div>
    <div class="center btn-black" *ngIf="publicacionPermiso" (click)="addArticle()">
      <a class="link"> Agregar artículo </a>
    </div>
  </div>
  <table mat-table [dataSource]="dataSource" [hidden]="displayedNotFound" matSort>
    <!-- ID Column -->
    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Título</th>
      <td mat-cell *matCellDef="let row" (click)="editArticulo(row.idPublicacion)">
        {{ row.titulo }}
      </td>
    </ng-container>

    <ng-container matColumnDef="primerAutor">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Primer autor</th>
      <td mat-cell *matCellDef="let row" (click)="editArticulo(row.idPublicacion)">
        <div class="flex-news" *ngIf="row.usuario.length != 0">
          <div class="member-img-round mr-8">
            <img
              class="member-img"
              src="{{ url + 'usuario/get-image-usuario/' + row.usuario[0].foto }}"
              alt="../../assets/img/user.png"
              *ngIf="row.usuario[0].foto"
            />
            <img class="member-img" src="../../assets/img/user.png" alt="" *ngIf="!row.usuario[0].foto" />
          </div>
          {{ row.usuario[0].nombreCompleto }}
        </div>
        <div *ngIf="row.usuario.length == 0 && row.autor.length != 0">
          {{ row.autor[0].nombre }}
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="publicacion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Publicación</th>
      <td mat-cell *matCellDef="let row" (click)="editArticulo(row.idPublicacion)">
        {{ row.fecha }}
      </td>
    </ng-container>

    <ng-container matColumnDef="DOI">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>DOI</th>
      <td mat-cell *matCellDef="let row" (click)="editArticulo(row.idPublicacion)">
        <a class="link-DOI" href="https://doi.org/{{ row.DOI }}">{{ row.DOI }} </a>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [hidden]="displayedNotFound"></mat-paginator>
  <span class="plex-sans" *ngIf="displayedNotFound">No se encontraron resultados</span>
</div>
