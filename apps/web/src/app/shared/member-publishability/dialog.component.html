<h2 mat-dialog-title>Estado de publicación</h2>
<div mat-dialog-content>
  <p><strong>Miembro:</strong> {{ data.memberName }}</p>
  <p>{{ status.summary }}</p>
  @if (status.reasons.length > 0) {
    <ul>
      @for (reason of status.reasons; track reason) {
        <li>{{ reason }}</li>
      }
    </ul>
  }
</div>
<div mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cerrar</button>
</div>
