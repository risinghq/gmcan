<div class="rich-text-editor">
  <div class="rich-text-toolbar" role="toolbar" aria-label="Formato del texto">
    <select
      class="rich-text-toolbar-select"
      aria-label="Estilo del texto"
      [value]="currentBlock"
      (change)="setBlock($event)"
      (mousedown)="$event.preventDefault()"
    >
      @for (option of headingOptions; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
    <button
      type="button"
      class="rich-text-toolbar-button"
      data-action="bold"
      aria-label="Negrita"
      [attr.aria-pressed]="editor.isActive('bold')"
      (mousedown)="$event.preventDefault()"
      (click)="toggleBold()"
    >
      <strong>N</strong>
    </button>
    <button
      type="button"
      class="rich-text-toolbar-button"
      data-action="italic"
      aria-label="Cursiva"
      [attr.aria-pressed]="editor.isActive('italic')"
      (mousedown)="$event.preventDefault()"
      (click)="toggleItalic()"
    >
      <em>K</em>
    </button>
    <button
      type="button"
      class="rich-text-toolbar-button"
      data-action="underline"
      aria-label="Subrayado"
      [attr.aria-pressed]="editor.isActive('underline')"
      (mousedown)="$event.preventDefault()"
      (click)="toggleUnderline()"
    >
      <u>S</u>
    </button>
    <button
      type="button"
      class="rich-text-toolbar-button"
      data-action="bullet-list"
      aria-label="Lista con viñetas"
      [attr.aria-pressed]="editor.isActive('bulletList')"
      (mousedown)="$event.preventDefault()"
      (click)="toggleBulletList()"
    >
      • Lista
    </button>
    <button
      type="button"
      class="rich-text-toolbar-button"
      data-action="ordered-list"
      aria-label="Lista numerada"
      [attr.aria-pressed]="editor.isActive('orderedList')"
      (mousedown)="$event.preventDefault()"
      (click)="toggleOrderedList()"
    >
      1. Lista
    </button>
    <button
      type="button"
      class="rich-text-toolbar-button"
      data-action="link"
      aria-label="Enlace"
      [attr.aria-pressed]="editor.isActive('link')"
      (mousedown)="$event.preventDefault()"
      (click)="setLink()"
    >
      Enlace
    </button>
  </div>
  <tiptap-editor [editor]="editor" aria-label="Contenido" />
</div>
