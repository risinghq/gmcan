<mat-tab-group class="noticias-div" [(selectedIndex)]="selectedTab" (selectedIndexChange)="changedTab($event)">
  <mat-tab label="Listado de artículos">
    <div class="flex-news mb-16">
      <div class="search-news">
        <input
          type="search"
          class="input-search-text"
          aria-label="Buscar artículos por título o fecha de publicación"
          (keyup)="articles.filterFrom($event)"
          placeholder="Buscar artículos por título o fecha de publicación"
        />
        <app-icon class="icon-search-toolbar" name="search" />
      </div>
      <button type="button" class="center btn-black" (click)="addArticle()">
        <span class="link">Agregar artículo</span>
      </button>
    </div>
    <table mat-table [dataSource]="articles.dataSource" [hidden]="articles.notFound()" matSort #articlesSort="matSort">
      <ng-container matColumnDef="titulo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Título</th>
        <td mat-cell *matCellDef="let row">
          <button type="button" class="row-action">{{ row.title }}</button>
          @if (row.doi) {
            <a
              class="link-DOI"
              href="https://doi.org/{{ row.doi }}"
              target="_blank"
              rel="noopener"
              (click)="$event.stopPropagation()"
              >{{ row.doi }}</a
            >
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="primerAutor">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Primer autor</th>
        <td mat-cell *matCellDef="let row">
          @if (row.authors && row.authors.length != 0) {
            @let principal = row.authors[0];
            <app-person [name]="principal.name" [src]="principal.photoUrl" [alt]="principal.photoAlt" />
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="publicacion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Publicación</th>
        <td mat-cell *matCellDef="let row">
          {{ row.fecha }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        class="clickable-row"
        *matRowDef="let row; columns: displayedColumns"
        (click)="editArticulo(row.id)"
      ></tr>
    </table>

    <mat-paginator [hidden]="articles.notFound()" #articlesPaginator />
    @if (articles.notFound()) {
      <app-empty-list [searching]="articles.searching()">Todavía no hay artículos.</app-empty-list>
    }
  </mat-tab>
  <mat-tab label="Revistas">
    <div class="flex-news mb-16">
      <div class="search-news">
        <input
          type="search"
          class="input-search-text"
          aria-label="Buscar revista por nombre"
          (keyup)="journals.filterFrom($event)"
          placeholder="Buscar revista por nombre"
        />
        <app-icon class="icon-search-toolbar" name="search" />
      </div>
      <button type="button" class="center btn-black" (click)="addRevista()">
        <span class="link">Agregar revista</span>
      </button>
    </div>
    <table mat-table [dataSource]="journals.dataSource" [hidden]="journals.notFound()" matSort #journalsSort="matSort">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let row">
          <button type="button" class="row-action">{{ row.name }}</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns2"></tr>
      <tr
        mat-row
        class="clickable-row"
        *matRowDef="let row; columns: displayedColumns2"
        (click)="editRevista(row.id)"
      ></tr>
    </table>

    <mat-paginator [hidden]="journals.notFound()" #journalsPaginator />
    @if (journals.notFound()) {
      <app-empty-list [searching]="journals.searching()">Todavía no hay revistas.</app-empty-list>
    }
  </mat-tab>
</mat-tab-group>
