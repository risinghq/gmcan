<mat-tab-group class="noticias-div" [(selectedIndex)]="selectedTab" (selectedIndexChange)="changedTab($event)">
  <mat-tab label="Listado de tesis">
    <div class="flex-news mb-16">
      <div class="search-news">
        <input
          type="search"
          class="input-search-text"
          aria-label="Buscar tesis por título, universidad o fecha de publicación"
          (keyup)="theses.filterFrom($event)"
          placeholder="Buscar tesis por título, universidad o fecha de publicación"
        />
        <app-icon class="icon-search-toolbar" name="search" />
      </div>
      <button type="button" class="center btn-black" (click)="addThesis()">
        <span class="link">Agregar tesis</span>
      </button>
    </div>
    <table mat-table [dataSource]="theses.dataSource" [hidden]="theses.notFound()" matSort #thesesSort="matSort">
      <ng-container matColumnDef="titulo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Título</th>
        <td mat-cell *matCellDef="let row">
          <button type="button" class="row-action">{{ row.title }}</button>
        </td>
      </ng-container>

      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Tipo</th>
        <td mat-cell *matCellDef="let row">
          {{ row.thesisTypeName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="autores">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Autor(es)</th>
        <td mat-cell *matCellDef="let row">
          @for (autor of row.authors; track autor) {
            <app-person [name]="autor.name" [src]="autor.photoUrl" [alt]="autor.photoAlt" />
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="universidad">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Universidad</th>
        <td mat-cell *matCellDef="let row">
          {{ row.universityName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="publicacion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Publicación</th>
        <td mat-cell *matCellDef="let row">
          {{ row.fecha }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        class="clickable-row"
        *matRowDef="let row; columns: displayedColumns"
        (click)="editThesis(row.id)"
      ></tr>
    </table>

    <mat-paginator [hidden]="theses.notFound()" #thesesPaginator />
    @if (theses.notFound()) {
      <app-empty-list [searching]="theses.searching()">Todavía no hay tesis.</app-empty-list>
    }
  </mat-tab>
  <mat-tab label="Universidad">
    <div class="flex-news mb-16">
      <div class="search-news">
        <input
          type="search"
          class="input-search-text"
          aria-label="Buscar universidad por nombre"
          (keyup)="universities.filterFrom($event)"
          placeholder="Buscar universidad por nombre"
        />
        <app-icon class="icon-search-toolbar" name="search" />
      </div>
      <button type="button" class="center btn-black" (click)="addUniversidad()">
        <span class="link">Agregar universidad</span>
      </button>
    </div>
    <table
      mat-table
      [dataSource]="universities.dataSource"
      [hidden]="universities.notFound()"
      matSort
      #universitiesSort="matSort"
    >
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let row">
          <button type="button" class="row-action">{{ row.name }}</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns2"></tr>
      <tr
        mat-row
        class="clickable-row"
        *matRowDef="let row; columns: displayedColumns2"
        (click)="editUniversidad(row.id)"
      ></tr>
    </table>

    <mat-paginator [hidden]="universities.notFound()" #universitiesPaginator />
    @if (universities.notFound()) {
      <app-empty-list [searching]="universities.searching()">Todavía no hay universidades.</app-empty-list>
    }
  </mat-tab>
</mat-tab-group>
