<div class="noticias-div">
  <div class="flex-news mb-16">
    <div class="search-news">
      <input
        type="search"
        class="input-search-text"
        aria-label="Buscar tesis por título, universidad o fecha de publicación"
        (keyup)="table.filterFrom($event)"
        placeholder="Buscar tesis por título, universidad o fecha de publicación"
      />
      <app-icon class="icon-search-toolbar" name="search" />
    </div>
    <button type="button" class="center btn-black" (click)="addThesis()">
      <span class="link">Agregar tesis</span>
    </button>
  </div>
  <table mat-table [dataSource]="table.dataSource" [hidden]="table.notFound()" matSort #tableSort="matSort">
    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Título</th>
      <td mat-cell *matCellDef="let row">
        <button type="button" class="row-action">{{ row.title }}</button>
      </td>
    </ng-container>

    <ng-container matColumnDef="tipo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Tipo</th>
      <td mat-cell *matCellDef="let row">
        {{ row.thesisTypeName }}
      </td>
    </ng-container>

    <ng-container matColumnDef="autores">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Autor(es)</th>
      <td mat-cell *matCellDef="let row">
        @for (autor of row.authors; track autor) {
          <app-person [name]="autor.name" [src]="autor.photoUrl" [alt]="autor.photoAlt" />
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="universidad">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Universidad</th>
      <td mat-cell *matCellDef="let row">
        {{ row.universityName }}
      </td>
    </ng-container>

    <ng-container matColumnDef="publicacion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Publicación</th>
      <td mat-cell *matCellDef="let row">
        {{ row.fecha }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row class="clickable-row" *matRowDef="let row; columns: displayedColumns" (click)="editThesis(row.id)"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [hidden]="table.notFound()" #tablePaginator />
  @if (table.notFound()) {
    <span class="plex-sans">No se encontraron resultados</span>
  }
</div>
