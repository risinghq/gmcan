<div class="noticias-div">
  <div class="flex-news mb-16">
    <div class="search-news">
      <input
        type="search"
        class="input-search-text"
        aria-label="Buscar artículos por título o fecha de publicación"
        (keyup)="table.filterFrom($event)"
        placeholder="Buscar artículos por título o fecha de publicación"
      />
      <app-icon class="icon-search-toolbar" name="search" />
    </div>
    <button type="button" class="center btn-black" (click)="addArticle()">
      <span class="link">Agregar artículo</span>
    </button>
  </div>
  <table mat-table [dataSource]="table.dataSource" [hidden]="table.notFound()" matSort #tableSort="matSort">
    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Título</th>
      <td mat-cell *matCellDef="let row">
        <button type="button" class="row-action">{{ row.title }}</button>
      </td>
    </ng-container>

    <ng-container matColumnDef="primerAutor">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Primer autor</th>
      <td mat-cell *matCellDef="let row">
        @if (row.authors && row.authors.length != 0) {
          @let principal = row.authors[0];
          <div class="flex-news">
            <div class="member-img-round mr-8">
              <app-avatar
                class="member-img"
                [src]="principal.photoUrl"
                [alt]="principal.photoAlt"
                [name]="principal.name"
              />
            </div>
            {{ principal.name }}
          </div>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="publicacion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Publicación</th>
      <td mat-cell *matCellDef="let row">
        {{ row.fecha }}
      </td>
    </ng-container>

    <ng-container matColumnDef="DOI">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>DOI</th>
      <td mat-cell *matCellDef="let row">
        <a class="link-DOI" href="https://doi.org/{{ row.doi }}">{{ row.doi }} </a>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      class="clickable-row"
      *matRowDef="let row; columns: displayedColumns"
      (click)="editArticulo(row.id)"
    ></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [hidden]="table.notFound()" #tablePaginator />
  @if (table.notFound()) {
    <span class="plex-sans">No se encontraron resultados</span>
  }
</div>
