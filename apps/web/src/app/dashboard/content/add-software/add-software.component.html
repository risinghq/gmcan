<div class="pad">
  <div class="add-box">
    <div class="member-detail-links">
      <div class="flex-news">
        <div class="flex-news back-div" (click)="return()">
          <mat-icon class="back-icon"> arrow_back </mat-icon>
          <div class="back-text">Volver</div>
        </div>
        <div class="right obligatory-text"><span class="red-text">(*) </span>Campos obligatorios</div>
      </div>
      <form [formGroup]="softwareForm" class="mt-24 mb-32">
        <div class="full-width">
          <div class="text-category">Nombre del software <span class="red-text">*</span></div>
          <input [(ngModel)]="software.name" formControlName="name" name="name" class="input-category" required />
        </div>
        <div class="full-width">
          <div class="text-category">Descripción</div>
          <textarea
            [(ngModel)]="software.description"
            formControlName="description"
            name="description"
            class="input-category"
            required
            autosize
          ></textarea>
        </div>
        <div class="full-width">
          <div class="text-category">Enlace</div>
          <input [(ngModel)]="software.moreInfo" formControlName="moreInfo" name="moreInfo" class="input-category" />
        </div>
      </form>
      <div class="flex-news">
        @if (edit) {
          <div class="red-btn">
            <div class="link link-set link-red" (click)="openEraser()">Eliminar software</div>
          </div>
        }
        <div class="right" [class]="{ 'btn-grey': !softwareForm.valid, 'black-btn': softwareForm.valid }">
          <div class="link link-set" (click)="submitSoftware()">
            {{ button_text }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
