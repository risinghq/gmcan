<div>
  <div class="flex-news mb-16">
    <div class="search-news">
      @if (mode === "line") {
      <input class="input-search-text" (keyup)="state.applyFilter($event)" placeholder="Buscar línea por nombre" />
      } @else {
      <input class="input-search-text" (keyup)="state.applyFilter2($event)" placeholder="Buscar línea por nombre" />
      }
      <mat-icon class="icon-search-toolbar">search</mat-icon>
    </div>
    @if (mode === "line") {
    <div class="center btn-black" (click)="state.addLinea()"><a class="link"> Agregar línea </a></div>
    } @else {
    <div class="center btn-black" (click)="state.addMethod()"><a class="link"> Agregar método </a></div>
    }
  </div>

  <table
    mat-table
    [dataSource]="mode === 'line' ? state.dataSource : state.dataSource2"
    [hidden]="mode === 'line' ? state.displayedNotFound : state.displayedNotFound2"
    matSort
  >
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
      @if (mode === "line") {
      <td mat-cell *matCellDef="let row" (click)="state.editLinea(row.id)">{{ row.name }}</td>
      } @else {
      <td mat-cell *matCellDef="let row" (click)="state.editMethod(row.id)">{{ row.name }}</td>
      }
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="mode === 'line' ? state.displayedColumns : state.displayedColumns2"></tr>
    <tr mat-row *matRowDef="let row; columns: mode === 'line' ? state.displayedColumns : state.displayedColumns2"></tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="[5, 10, 25, 100]"
    [hidden]="mode === 'line' ? state.displayedNotFound : state.displayedNotFound2"
  />
  @if (mode === "line" ? state.displayedNotFound : state.displayedNotFound2) {
  <span class="plex-sans">No se encontraron resultados</span>
  }
</div>
