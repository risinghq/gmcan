<form [formGroup]="state.trabajosFuturosForm">
  <div class="full-width mb-24">
    <div class="flex-news">
      <div class="text-category">Descripción <span class="red-text">*</span></div>
      <div class="green-text right plex-sans" (click)="state.previewFuture()">Vista Previa</div>
    </div>
    <app-rich-text-editor formControlName="futureWork" />
  </div>
  <div class="right black-btn mb-12">
    <div class="link link-set" (click)="state.submitTrabajosFuturos()">Actualizar información</div>
  </div>
</form>
