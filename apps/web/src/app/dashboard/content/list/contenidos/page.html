<mat-tab-group class="noticias-div" [(selectedIndex)]="state.selectedTab" (selectedIndexChange)="state.setTab($event)">
  <mat-tab label="Grupo">
    <div class="title mb-16">Información del grupo</div>
    <p class="mb-16">Logos, contacto, presentación, facilidades, trabajos futuros y secciones del sitio.</p>
    <a class="btn-black d-flex mb-24" routerLink="/dashboard/edit-grupo">
      <span class="link link-set">Editar grupo</span>
    </a>
    <div class="title mb-16">¿Quiénes somos?</div>
    <p class="mb-16">Imagen del equipo, descripción, objetivos, servicios y el resumen de la página de inicio.</p>
    <a class="btn-black d-flex mb-24" routerLink="/dashboard/edit-quienes-somos">
      <span class="link link-set">Editar ¿Quiénes somos?</span>
    </a>
  </mat-tab>
  <mat-tab label="Líneas de investigación">
    <app-content-table
      [table]="state.lines"
      searchLabel="Buscar línea por nombre"
      addLabel="Agregar línea"
      emptyLabel="Todavía no hay líneas de investigación."
    />
  </mat-tab>
  <mat-tab label="Métodos">
    <app-content-table
      [table]="state.methods"
      searchLabel="Buscar método por nombre"
      addLabel="Agregar método"
      emptyLabel="Todavía no hay métodos."
    />
  </mat-tab>
  <mat-tab label="Facilidades y recursos">
    <div class="title mb-16">Equipos instalados</div>
    <app-content-table
      [table]="state.equipment"
      searchLabel="Buscar equipo"
      addLabel="Agregar equipo"
      emptyLabel="Todavía no hay equipos."
    />
    <div class="title mb-16">Software</div>
    <app-content-table
      [table]="state.software"
      searchLabel="Buscar software"
      addLabel="Agregar software"
      emptyLabel="Todavía no hay software."
    />
  </mat-tab>
</mat-tab-group>
