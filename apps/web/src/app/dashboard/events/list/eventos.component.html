<mat-tab-group class="noticias-div" [(selectedIndex)]="selectedTab" (selectedIndexChange)="changedTab($event)">
  <mat-tab label="Listado de resúmenes">
    <div class="flex-news mb-16">
      <div class="search-news">
        <input
          type="search"
          class="input-search-text"
          aria-label="Buscar resumen por título, fecha de publicación o evento"
          (keyup)="abstracts.filterFrom($event)"
          placeholder="Buscar resumen por título, fecha de publicación o evento"
        />
        <app-icon class="icon-search-toolbar" name="search" />
      </div>
      <button type="button" class="center btn-black" (click)="addResumen()">
        <span class="link">Agregar resumen</span>
      </button>
    </div>
    <table
      mat-table
      [dataSource]="abstracts.dataSource"
      [hidden]="abstracts.notFound()"
      matSort
      #abstractsSort="matSort"
    >
      <ng-container matColumnDef="titulo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Título</th>
        <td mat-cell *matCellDef="let row">
          <button type="button" class="row-action">{{ row.title }}</button>
        </td>
      </ng-container>

      <ng-container matColumnDef="primerAutor">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Primer autor</th>
        <td mat-cell *matCellDef="let row">
          <app-person [name]="row.firstAuthorName" [src]="row.firstAuthorPhotoUrl" [alt]="row.firstAuthorPhotoAlt" />
        </td>
      </ng-container>

      <ng-container matColumnDef="presentacion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Publicación</th>
        <td mat-cell *matCellDef="let row">
          {{ row.publishedAtLabel }}
        </td>
      </ng-container>

      <ng-container matColumnDef="evento">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Evento</th>
        <td mat-cell *matCellDef="let row">
          {{ row.eventName }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        class="clickable-row"
        *matRowDef="let row; columns: displayedColumns"
        (click)="editResumen(row.id)"
      ></tr>
    </table>

    <mat-paginator [hidden]="abstracts.notFound()" #abstractsPaginator />
    @if (abstracts.notFound()) {
      <app-empty-list [searching]="abstracts.searching()">Todavía no hay resúmenes.</app-empty-list>
    }
  </mat-tab>
  <mat-tab label="Eventos">
    <div class="flex-news mb-16">
      <div class="search-news">
        <input
          type="search"
          class="input-search-text"
          aria-label="Buscar evento por nombre, país o ciudad"
          (keyup)="events.filterFrom($event)"
          placeholder="Buscar evento por nombre, país o ciudad"
        />
        <app-icon class="icon-search-toolbar" name="search" />
      </div>
      <button type="button" class="center btn-black" (click)="addEvento()">
        <span class="link">Agregar evento</span>
      </button>
    </div>
    <table mat-table [dataSource]="events.dataSource" [hidden]="events.notFound()" matSort #eventsSort="matSort">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let row">
          <button type="button" class="row-action">{{ row.name }}</button>
        </td>
      </ng-container>

      <ng-container matColumnDef="pais">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>País</th>
        <td mat-cell *matCellDef="let row">{{ row.country }}</td>
      </ng-container>

      <ng-container matColumnDef="ciudad">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Ciudad</th>
        <td mat-cell *matCellDef="let row">{{ row.city }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns2"></tr>
      <tr
        mat-row
        class="clickable-row"
        *matRowDef="let row; columns: displayedColumns2"
        (click)="editEvento(row.id)"
      ></tr>
    </table>

    <mat-paginator [hidden]="events.notFound()" #eventsPaginator />
    @if (events.notFound()) {
      <app-empty-list [searching]="events.searching()">Todavía no hay eventos.</app-empty-list>
    }
  </mat-tab>
</mat-tab-group>
