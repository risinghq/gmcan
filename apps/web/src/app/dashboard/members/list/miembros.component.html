<div class="miembros-card">
  <div class="flex-news mb-16">
    <div class="search-news">
      <input
        type="search"
        class="input-search-text"
        aria-label="Buscar miembro por nombre, apellido, grado, cargo o correo."
        (keyup)="table.filterFrom($event)"
        placeholder="Buscar miembro por nombre, apellido, grado, cargo o correo."
      />
      <app-icon class="icon-search-toolbar" name="search" />
    </div>
    @if (canAdd) {
      <button type="button" class="center btn-black" (click)="addMember()">
        <span class="link">Agregar miembro al grupo</span>
      </button>
    }
  </div>
  <table mat-table [dataSource]="table.dataSource" [hidden]="table.notFound()" matSort>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Miembro</th>
      <td mat-cell *matCellDef="let row">
        <app-person [name]="fullName(row)" [src]="row.photoUrl" [alt]="row.photoAlt">
          <span class="member">
            <button type="button" class="row-action">{{ fullName(row) }}</button>
            <span class="member-email">{{ row.email }}</span>
          </span>
        </app-person>
      </td>
    </ng-container>

    <ng-container matColumnDef="prefixName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Grado académico</th>
      <td mat-cell *matCellDef="let row">
        {{ row.prefixName }}
      </td>
    </ng-container>

    <ng-container matColumnDef="memberTypeName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Cargo</th>
      <td mat-cell *matCellDef="let row">{{ row.memberTypeName }}</td>
    </ng-container>

    <ng-container matColumnDef="publishability">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let row">
        @let status = publishabilityStatus(row.publishability);
        <button
          type="button"
          class="status-chip"
          [class.status-ready]="status.tone === 'ready'"
          [class.status-draft]="status.tone === 'draft'"
          [class.status-archived]="status.tone === 'hidden'"
          (click)="openPublishability(row, $event)"
        >
          {{ status.label }}
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row class="clickable-row" *matRowDef="let row; columns: displayedColumns" (click)="editMember(row.id)"></tr>
  </table>
  <mat-paginator [hidden]="!table.paged()" />
  @if (table.notFound()) {
    <app-empty-list [searching]="table.searching()">
      Todavía no hay miembros {{ canAdd ? "activos" : "antiguos" }}.
    </app-empty-list>
  }
</div>
