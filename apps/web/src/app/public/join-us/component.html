<div class="page join-div">
  <div class="row">
    <div class="col-lg-8 col-sm-6 col-12">
      <app-breadcrumb [trail]="[{ label: language.join }]" />
      <div class="email-div">
        <a class="flex-news back-div" [routerLink]="previouslink">
          <app-icon class="back-icon" name="arrow-left" />
          <span class="back-text">{{ language.joinUsText[0].back }}</span>
        </a>
        <div class="email-title">{{ language.joinUsText[0].title }}</div>
        <div class="email-subtitle mb-16">{{ language.joinUsText[0].talkabout }}</div>
        <form [formGroup]="user" (ngSubmit)="sendEmail()">
          <div class="full-width mb-16-8">
            <input
              class="input-email"
              placeholder="{{ language.joinUsText[0].name }}"
              [attr.aria-label]="language.joinUsText[0].name"
              name="nombre"
              formControlName="nombre"
              autocomplete="name"
              required
            />
          </div>
          <div class="full-width mb-24">
            <textarea
              autosize
              class="input-email"
              placeholder="{{ language.joinUsText[0].reason }}"
              [attr.aria-label]="language.joinUsText[0].reason"
              name="razon"
              formControlName="razon"
              required
            ></textarea>
          </div>
          <div class="email-subtitle mb-16">{{ language.joinUsText[0].email }}</div>
          <div class="flex-email">
            <div class="full-width mr-8 mb-8">
              <input
                class="input-email"
                placeholder="{{ language.joinUsText[0].emailPlace }}"
                [attr.aria-label]="language.joinUsText[0].emailPlace"
                name="correo"
                type="email"
                formControlName="correo"
                autocomplete="email"
                required
              />
            </div>
            <div class="full-width ml-8">
              <input
                class="input-email"
                type="tel"
                placeholder="{{ language.joinUsText[0].telephone }}"
                [attr.aria-label]="language.joinUsText[0].telephone"
                name="telefono"
                formControlName="telefono"
                autocomplete="tel"
                required
              />
            </div>
          </div>
          <div class="full-width mb-16-8">
            <button type="submit" class="btn-black email-btn" [disabled]="user.invalid || sending()">
              <span class="link">{{ language.joinUsText[0].send }}</span>
            </button>
          </div>
          @if (sendFailed()) {
          <div class="send-error" role="alert">{{ language.joinUsText[0].sendFailed }}</div>
          }
        </form>
      </div>
    </div>
    <div class="col-lg-4 col-sm-6 col-12">
      <app-news />
    </div>
  </div>
</div>
