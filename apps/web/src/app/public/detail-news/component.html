@let newsItem = item();
<div class="page detail-div">
  <div class="row">
    <div class="col-lg-8 col-12">
      <app-breadcrumb [trail]="trail()" />
      <article class="card-detail">
        <header [class.news-header-img]="newsItem.asset">
          @if (newsItem.asset) {
          <img class="detail-img" [src]="newsItem.asset" alt="" fetchpriority="high" />
          }
          <h1 class="news-title">{{ newsItem.title }}</h1>
        </header>
        <div class="detail-text-div">
          @if (newsItem.summary) {
          <p class="news-abstract">{{ newsItem.summary }}</p>
          }
          <div class="author-div">
            <app-avatar
              class="author-img"
              [src]="newsItem.authorPhotoUrl"
              [alt]="newsItem.authorPhotoAlt"
              [name]="newsItem.authorName"
              loading="eager"
            />
            <div class="author-text">
              @if (newsItem.authorId) {
              <a class="author-name" [routerLink]="['/detail-member', newsItem.authorId]">{{ newsItem.authorName }}</a>
              } @else {
              <div class="author-name">{{ newsItem.authorName }}</div>
              }
              <app-news-meta
                [type]="newsItem.newsKindName"
                [date]="newsItem.publishedAt"
                [label]="news().publishedAtLabel"
              />
            </div>
          </div>
          <app-share-links class="share" [url]="shareUrl()" [title]="newsItem.title" />
          @if (newsItem.body) {
          <div class="detail-text" [innerHTML]="newsItem.body"></div>
          }
        </div>
      </article>
    </div>
    <div class="col-lg-4 col-12">
      <app-news />
    </div>
  </div>
</div>
