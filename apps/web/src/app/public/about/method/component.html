<div class="card-methods">
  <h1 class="visually-hidden">{{ language().methods }}</h1>
  <div class="methods-text-div">
    @for (method of methods(); track method; let i = $index) {
    <div>
      <div class="methods-img-div">
        @if (method.asset) {
        <img class="methods-img" src="{{ method.asset }}" alt="" />
        }
      </div>
      <h2 class="methods-title">{{ method.name }}</h2>
      <div class="methods-sub-divi"></div>
      <div class="methods-text" [innerHTML]="method.description"></div>
    </div>
    }
  </div>
</div>
