<div class="page about-div">
  <div class="row">
    <div class="col-lg-8 col-sm-6 col-12">
      <app-breadcrumb [trail]="[{ label: facade.language().aboutUs }, { label: facade.selectedCategory() }]" />
      <router-outlet />
    </div>
    <div class="col-lg-4 col-sm-6 col-12">
      <div class="about-categories">
        <div
          class="about-category"
          routerLink="./about"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ facade.language().who }}
        </div>
        <div
          class="about-category"
          routerLink="./lines-investigation"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ facade.language().linesInvestigation }}
        </div>
        <div
          class="about-category"
          routerLink="./methods"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ facade.language().methods }}
        </div>
        <div
          class="about-category"
          routerLink="./facilities-resources"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ facade.language().resources }}
        </div>
        <div
          class="about-category"
          routerLink="./works"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ facade.language().futureWorks }}
        </div>
      </div>
    </div>
  </div>
</div>
