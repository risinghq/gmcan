<div class="page about-div">
  <div class="row">
    <div class="col-lg-8 col-sm-6 col-12">
      <app-breadcrumb [trail]="[{ label: facade.language().aboutUs }, { label: facade.selectedCategory() }]" />
      <router-outlet />
    </div>
    <div class="col-lg-4 col-sm-6 col-12">
      <nav class="about-categories" [attr.aria-label]="facade.language().aboutUs">
        @for (category of categories(); track category.path) {
        <a
          class="about-category"
          [routerLink]="category.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="pathOnly"
        >
          {{ category.label }}
        </a>
        }
      </nav>
    </div>
  </div>
</div>
