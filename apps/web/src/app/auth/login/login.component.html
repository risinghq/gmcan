<div class="page login-div">
  <button type="button" class="flex-news back-div" (click)="return()">
    <app-icon class="back-icon" name="arrow-left" />
    <span class="back-text">{{ language.backAll }}</span>
  </button>
  <div class="login-card">
    <img class="logo-icon" [src]="grupoinfo().assets.header" alt="logo" />
    @if (!recoverValue()) {
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="login-title">
          {{ language.login }}
        </div>
        <input
          class="input-email full-width"
          [placeholder]="language.loginText[0].email"
          name="email"
          formControlName="email"
          type="email"
          autocomplete="username"
          required
        />
        <input
          class="input-password mt-input-16 full-width"
          [placeholder]="language.loginText[0].password"
          name="password"
          formControlName="password"
          autocomplete="current-password"
          required
          type="password"
        />
        <button type="submit" class="btn-black" [disabled]="loginForm.invalid || loading()">
          <span class="link">{{ language.loginText[0].login }}</span>
        </button>
        <button type="button" class="forgot link" (click)="change()">
          {{ language.loginText[0].forgot }}
        </button>
      </form>
    } @else {
      <form [formGroup]="emailForm" (ngSubmit)="recover()">
        <button type="button" class="flex-news back-div recover-back" (click)="change()">
          <app-icon class="back-icon" name="arrow-left" />
          <span class="back-text">{{ language.detailMemberText[0].back }}</span>
        </button>
        <div class="login-title recover-title">Recuperar contraseña</div>
        <div class="login-subtitle">
          Ingresa tu correo electrónico y te enviaremos un link para que puedas restaurar tu contraseña.
        </div>
        <input
          class="input-email full-width"
          [placeholder]="language.loginText[0].email"
          name="email"
          formControlName="email"
          type="email"
          autocomplete="email"
          required
        />
        <button type="submit" class="btn-black" [disabled]="emailForm.invalid || loading()">
          <span class="link">Recuperar contraseña</span>
        </button>
      </form>
    }
  </div>
  @if (error(); as message) {
    <div class="error">
      {{ message }}
    </div>
  }
  @if (exito(); as message) {
    <div class="exito">
      {{ message }}
    </div>
  }
</div>
