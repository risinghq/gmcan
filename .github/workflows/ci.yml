name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A master run may be deploying; stopping it halfway could leave migrations applied without the code that uses them.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      # Production applies each migration once by name, so an edit to an applied file never reaches it.
      # A pull request checks out its merge commit, whose first parent is the base branch.
      - name: Applied migrations are unchanged
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=MDR HEAD^1 HEAD -- apps/api/migrations)
          if [ -n "$changed" ]; then
            echo "::error::Add a new migration instead of editing an applied one: $changed"
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run check

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment:
      name: production
      url: ${{ env.SITE }}
    env:
      SITE: https://gmcan-web.empirical.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: bun install --frozen-lockfile
      # The schema changes before the API, and the API before the web, which binds the gmcan-api service.
      - run: bun run migrate:remote
        working-directory: apps/api
      - run: bun run deploy
        working-directory: apps/api
      - run: bun run deploy
        working-directory: apps/web
      - run: bun scripts/smoke.ts "$SITE"
