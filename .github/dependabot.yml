version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # @angular/compiler-cli 22.2 peers on typescript >=6.0 <6.1; lift this once Angular accepts TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
